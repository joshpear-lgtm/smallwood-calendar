name: Refresh Smallwood calendars
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['sync.py', 'test_sync.py', '.github/workflows/sync.yml']
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: school-calendar-publish
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest -v
      - run: python sync.py
      - name: Save stable event metadata and latest feeds
        run: |
          git config user.name 'Smallwood Calendar Sync'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh school calendar feeds'
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        id: upload
        with:
          path: public
      # Use the upload ID directly: artifact listing can return zero after upload.
      - name: Publish calendars using uploaded artifact ID
        uses: actions/github-script@v8
        id: deployment
        env:
          PAGES_ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        with:
          script: |
            const artifactId = process.env.PAGES_ARTIFACT_ID;
            if (!/^\d+$/.test(artifactId || '')) throw new Error('Missing uploaded artifact ID');
            const oidc = await core.getIDToken();
            const {data: deployment} = await github.request('POST /repos/{owner}/{repo}/pages/deployments', {
              ...context.repo, artifact_id: Number(artifactId),
              pages_build_version: context.sha, oidc_token: oidc
            });
            core.setOutput('page_url', deployment.page_url);
            const deadline = Date.now() + 300000;
            while (Date.now() < deadline) {
              await new Promise(resolve => setTimeout(resolve, 5000));
              const {data: status} = await github.request('GET /repos/{owner}/{repo}/pages/deployments/{deployment_id}', {
                ...context.repo, deployment_id: deployment.id
              });
              core.info(`Pages deployment: ${status.status}`);
              if (status.status === 'succeed') return;
              if (!['deployment_in_progress', 'queued', 'waiting'].includes(status.status)) {
                throw new Error(`Pages deployment failed: ${status.status}`);
              }
            }
            throw new Error('Pages deployment timed out');
